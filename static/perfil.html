<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil</title>

  <link rel="icon" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/style.css">

  <script type="module" src="/static/perfil.js" defer></script>
</head>

<body>

  <header>
    <a href="/" class="brand">MeuGremio</a>

    <h1 class="title">PERFIL</h1>

    <div class="right">
      <button class="toggle" id="sideMenuToggle" type="button" aria-label="Abrir menu" aria-expanded="false">
        <img class="icon-menu" src="/static/icones/v branco/27.png" alt="Abrir menu">
        <img class="icon-close" src="/static/icones/v branco/28.png" alt="Fechar menu">
      </button>
    </div>

    <nav class="side-menu" id="sideMenu">
      <a href="/">
        <img src="/static/icones/v branco/31.png" alt=""><span>Feed</span>
      </a>
      <a href="/usuario/perfil">
        <img src="/static/icones/v branco/32.png" alt=""><span>Perfil</span>
      </a>
      <a href="#" class="accessibility-link">
        <img src="/static/icones/v branco/29.png" alt=""><span>Acessibilidade</span>
      </a>
      <a href="criacaodechapa">
        <img src="/static/icones/v branco/30.png" alt=""><span>Criação de Chapa</span>
      </a>
      <a href="votacao">
        <img src="/static/icones/v branco/34.png" alt=""><span>Votação</span>
      </a>
      <div class="spacer"></div>
      <a href="login" class="sair">
        <img src="/static/icones/v branco/33.png" alt=""><span>Sair</span>
      </a>
    </nav>
  </header>

  <main class="profile-page">
    <section class="profile-card center-card">

      <div class="profile-banner">
        <!-- <img alt="Banner do perfil"> -->
      </div>

      <div class="profile-body">
        <div class="profile-top">
          <div class="profile-avatar">
            <!-- <img alt="Logo do perfil"> -->
          </div>

          <div class="profile-info">
            <h2 class="profile-name">Fernando</h2>
            <p class="profile-class">3° ano de Informática</p>
          </div>

          <button class="btn-profile btn-primary" type="button">
            Editar Perfil
          </button>
        </div>

        <div class="profile-bottom">
          <span class="desc-title">Sobre mim</span>
          <span id="descContent">
            {{USER_DESC}}
          </span>
        </div>
      </div>

    </section>

    <h3 class="profile-section-divider">
      <span>Comentários</span>
    </h3>
  </main>
</body>

</html>
