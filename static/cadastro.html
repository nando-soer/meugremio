  <main class="container">
    <section class="center-card">
      <h2>Crie sua Conta</h2>

      <form class="credential-form" id="credentialForm">
        <div class="row">

          <div class="field">
            <label for="name">Nome:</label>
            <input type="text" id="userName" name="name" class="text-input" required>
          </div>

          <div class="field">
            <label for="class">Turma:</label>

            <div class="select-wrap">
              <select id="userClass" name="turma" class="select-display" required>
                <option value="" disabled selected>Selecione...</option>
                <option value="3_info">3° INFO</option>
                <option value="2_info">2° INFO</option>
                <option value="1_info">1° INFO</option>
                <option value="3_adm">3° ADM</option>
                <option value="2_adm">2° ADM</option>
                <option value="1_adm">1° ADM</option>
                <option value="1_mkt">1° MKT</option>
              </select>

              <span class="select-arrow">
                <img src="/static/icones/v branco/22.png">
              </span>
            </div>
          </div>

        </div>

        <div class="row">
          <div class="field">
            <label for="email">Email Institucional:</label>
            <input type="email" id="userEmail" name="email" class="text-input" required>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="password">Senha:</label>

            <div class="password-wrap">
              <input type="password" id="userPassword" name="password" class="text-input" required>

              <button type="button" class="eye-btn" id="passwordView" aria-label="Mostrar senha">
                <img class="eye-open" src="/static/icones/v grena/5.png">
                <img class="eye-closed" src="/static/icones/v grena/6.png">
              </button>
            </div>

            <div class="strength-bar" id="strengthBar">
              <div class="active-weak"></div>
              <div></div>
              <div></div>
            </div>

            <div>
              <span class="tag tag-right weak-password" id="passwordStrengthCheck">
                SENHA FRACA
              </span>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="confirmPassword">Confirmar Senha:</label>

            <div class="password-wrap">
              <input type="password" id="userConfirmPassword" name="confirmPassword" class="text-input" required>

              <button type="button" class="eye-btn" id="confirmPasswordView" aria-label="Mostrar senha">
                <img class="eye-open" src="/static/icones/v grena/5.png">
                <img class="eye-closed" src="/static/icones/v grena/6.png">
              </button>
            </div>

            <span class="tag tag-center incorrect-tag" id="confirmPasswordStatus">
              * SENHAS NÃO BATEM!
            </span>
          </div>
        </div>

        <a href="/usuario/entrar" class="tag-center">Já tenho uma conta</a>

        <button type="submit" class="btn-primary">
          Continuar
        </button>

      </form>
    </section>

  </main>
