  <main class="feed-container" id="feedContainer">

    <article class="post-card" data-post-id="1">

      <div class="post-header">
        <div class="avatar">
          <img src="/static/icones/v grena/32.png" alt="Avatar">
        </div>
        <span class="post-username">alcatec</span>
        <span class="post-hashtag">#divulgacao</span>
      </div>

      <p class="post-text">xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx...</p>

      <div class="post-media">
        <div class="post-divider"></div>
        <div class="carrossel-window">
          <div class="carrossel-rail">
            <div class="carrossel-slide"><img src="" alt=""></div>
            <div class="carrossel-slide"><img src="" alt=""></div>
            <div class="carrossel-slide"><img src="" alt=""></div>
          </div>
          <button type="button" class="carrossel-btn carrossel-prev" aria-label="Imagem anterior"><img
              src="/static/icones/v grena/21.png" alt=""></button>
          <button type="button" class="carrossel-btn carrossel-next" aria-label="Próxima imagem"><img
              src="/static/icones/v grena/20.png" alt=""></button>
          <div class="carrossel-dots"></div>
        </div>
      </div>

      <div class="post-actions">
        <button class="icon-btn" aria-label="Curtir">
          <img src="/static/icones/v grena/7.png" alt="">
        </button>
        <button class="icon-btn" aria-label="Comentar">
          <img src="/static/icones/v grena/9.png" alt="">
        </button>
        <button class="icon-btn" aria-label="Compartilhar">
          <img src="/static/icones/v grena/10.png" alt="">
        </button>

        <div class="actions-wrap">
          <button type="button" class="icon-btn" aria-label="Opções do post" aria-expanded="false">
            <img src="/static/icones/v grena/12.png" alt="">
          </button>
          <div class="config-menu hidden">
            <a class="menu-item" href="editar-post.html?id=TODO">Editar post</a>
            <button type="button" class="menu-item menu-item-excluir">Excluir post</button>
          </div>
        </div>
      </div>
    </article>

    <article class="post-card" data-post-id="2">

      <div class="post-header">

        </div>
        <span class="post-username">diretor_cultura</span>
        <span class="post-hashtag">#noticia</span>
      </div>

      <p class="post-text">xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx...</p>

      <div class="post-actions">
        <button class="icon-btn liked" aria-label="Descurtir">

        <button class="icon-btn" aria-label="Compartilhar">
          <img src="/static/icones/v grena/10.png" alt="">
        </button>

        <div class="actions-wrap">
          <button type="button" class="icon-btn" aria-label="Opções do post" aria-expanded="false">
            <img src="/static/icones/v grena/12.png" alt="">
          </button>
          <div class="config-menu hidden">
            <a class="menu-item" href="editar-post.html?id=2">Editar post</a>
            <button type="button" class="menu-item menu-item-excluir">Excluir post</button>

      </div>
    </article>

  </main>
