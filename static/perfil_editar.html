<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Perfil</title>

  <link rel="icon" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/style.css">

  <script type="module" src="/static/perfil_editar.js" defer></script>
</head>

<body>
  <header>
    <button class="back-btn" onclick="history.back()" aria-label="Voltar">
      <img src="/static/icones/v grena/21.png" alt="Voltar">
    </button>

    <h1 class="title">EDIÇÃO DE PERFIL</h1>

    <div class="right">
      <button class="toggle" id="sideMenuToggle" type="button" aria-label="Abrir menu" aria-expanded="false">
        <img class="icon-menu" src="/static/icones/v branco/27.png" alt="Abrir menu">
        <img class="icon-close" src="/static/icones/v branco/28.png" alt="Fechar menu">
      </button>
    </div>

    <nav class="side-menu" id="sideMenu">
      <a href="/">
        <img src="/static/icones/v branco/31.png" alt=""><span>Feed</span>
      </a>
      <a href="/usuario/perfil">
        <img src="/static/icones/v branco/32.png" alt=""><span>Perfil</span>
      </a>
      <a href="#" class="accessibility-link">
        <img src="/static/icones/v branco/29.png" alt=""><span>Acessibilidade</span>
      </a>
      <a href="criacaodechapa">
        <img src="/static/icones/v branco/30.png" alt=""><span>Criação de Chapa</span>
      </a>
      <a href="votacao">
        <img src="/static/icones/v branco/34.png" alt=""><span>Votação</span>
      </a>
      <div class="spacer"></div>
      <a href="login" class="sair">
        <img src="/static/icones/v branco/33.png" alt=""><span>Sair</span>
      </a>
    </nav>
  </header>

  <div class="container">
    <div class="edit-profile-card center-card">
      <div class="banner">
        <img id="studentBanner" src="/static/ilustracoes/banners/1.png" data-name="1">
        <button class="btn-banner btn-primary" type="button" id="openBanners">Alterar<br>Banner</button>
      </div>

      <div class="modal-banners" id="modalBanners">
        <div class="modal-content">
          <button class="modal-close" id="closeBanners" type="button" aria-label="Fechar"><img
              src="/static/icones/v grena/19.png" alt="Fechar"></button>
          <div class="banners-options">
            <div class="banner-option">
              <img src="/static/ilustracoes/banners/1.png" data-name="1" alt="Banner 1">
            </div>
            <div class="banner-option">
              <img src="/static/ilustracoes/banners/2.png" data-name="2" alt="Banner 2">
            </div>
            <div class="banner-option">
              <img src="/static/ilustracoes/banners/3.png" data-name="3" alt="Banner 3">
            </div>
            <div class="banner-option">
              <img src="/static/ilustracoes/banners/4.png" data-name="4" alt="Banner 4">
            </div>
            <div class="banner-option">
              <img src="/static/ilustracoes/banners/5.png" data-name="5" alt="Banner 5">
            </div>
            <div class="banner-option">
              <img src="/static/ilustracoes/banners/6.png" data-name="6" alt="Banner 6">
            </div>
            <div class="banner-option">
              <img src="/static/ilustracoes/banners/7.png" data-name="7" alt="Banner 7">
            </div>
            <div class="banner-option">
              <img src="/static/ilustracoes/banners/8.png" data-name="8" alt="Banner 8">
            </div>
            <div class="banner-option">
              <img src="/static/ilustracoes/banners/9.png" data-name="9" alt="Banner 9">
            </div>
            <div class="banner-option">
              <img src="/static/ilustracoes/banners/10.png" data-name="10" alt="Banner 10">
            </div>
          </div>
        </div>
      </div>

      <div class="avatar-wrap">
        <div class="avatar avatar-layers" id="studentAvatar">
          <img src="/static/ilustracoes/avatar/base/1.png" alt="Base">
          <img src="/static/ilustracoes/avatar/camisas/1.png" alt="Camisa">
          <img src="/static/ilustracoes/avatar/calcas/1.png" alt="Calça">
          <img src="/static/ilustracoes/avatar/acessorios/1.png" alt="Acessório">
        </div>
      </div>

      <div class="avatar-btn-wrap">
        <button class="btn-avatar btn-primary" type="button" id="openAvatarEdit">Alterar
          Avatar</button>
      </div>

      <form class="credential-form">
        <div class="row">
          <div class="field">
            <label for="studentName">Nome:</label>
            <input type="text" class="text-input" id='studentName' placeholder="{{STUDENT_NAME}}">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="studentClass">Turma:</label>
            <div class="select-wrap">
              <select name="turma" class="select-display" id='studentClass' required>
              </select>

              <span class="select-arrow">
                <img src="/static/icones/v branco/22.png">
              </span>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="studentDescription">Bio/Descrição:</label>
            <textarea class="text-input" id='studentDescription'></textarea>
          </div>
        </div>

        <button type="submit" class="btn-primary">Salvar</button>
      </form>

    </div>
  </div>

  <div class="avatar-modal-overlay" id="avatarModal">
    <div class="avatar-modal">
      <button class="modal-close" type="button" id="modalClose" aria-label="Fechar">
        <img src="/static/icones/v grena/19.png" alt="Fechar"></button>

      <div class="modal-left">
        <div class="modal-avatar avatar-layers" id='preview' data-selection="1,1,1,1">
          <img src="/static/ilustracoes/avatar/base/1.png" alt="Base">
          <img src="/static/ilustracoes/avatar/camisas/1.png" alt="Camisa">
          <img src="/static/ilustracoes/avatar/calcas/1.png" alt="Calça">
          <img src="/static/ilustracoes/avatar/acessorios/1.png" alt="Acessório">
        </div>
      </div>

      <div class="modal-right">
        <div class="options-scroll" id="optionsScroll">
          <div class="category-title">Base</div>
          <div class="option-grid">
            <div class="option-switch" data-selection="base,1">
              <img src="/static/ilustracoes/avatar/base/1.png" alt="Base 1">
            </div>
            <div class="option-switch" data-selection="base,2">
              <img src="/static/ilustracoes/avatar/base/2.png" alt="Base 2">
            </div>
            <div class="option-switch" data-selection="base,3">
              <img src="/static/ilustracoes/avatar/base/3.png" alt="Base 3">
            </div>
            <div class="option-switch" data-selection="base,4">
              <img src="/static/ilustracoes/avatar/base/4.png" alt="Base 4">
            </div>
            <div class="option-switch" data-selection="base,5">
              <img src="/static/ilustracoes/avatar/base/5.png" alt="Base 5">
            </div>
            <div class="option-switch" data-selection="base,6">
              <img src="/static/ilustracoes/avatar/base/6.png" alt="Base 6">
            </div>
            <div class="option-switch" data-selection="base,7">
              <img src="/static/ilustracoes/avatar/base/7.png" alt="Base 7">
            </div>
            <div class="option-switch" data-selection="base,8">
              <img src="/static/ilustracoes/avatar/base/8.png" alt="Base 8">
            </div>
            <div class="option-switch" data-selection="base,9">
              <img src="/static/ilustracoes/avatar/base/9.png" alt="Base 9">
            </div>
            <div class="option-switch" data-selection="base,10">
              <img src="/static/ilustracoes/avatar/base/10.png" alt="Base 10">
            </div>
          </div>

          <div class="category-title">Camisa</div>
          <div class="option-grid">
            <div class="option-switch none-option" data-selection="camisas,0">
              <img src="/static/icones/v grena/25.png" alt="Nenhum">
            </div>
            <div class="option-switch" data-selection="camisas,1"><img src="/static/ilustracoes/avatar/camisas/1.png"
                alt="Camisa 1"></div>
            <div class="option-switch" data-selection="camisas,2">
              <img src="/static/ilustracoes/avatar/camisas/2.png" alt="Camisa 2">
            </div>
            <div class="option-switch" data-selection="camisas,3">
              <img src="/static/ilustracoes/avatar/camisas/3.png" alt="Camisa 3">
            </div>
            <div class="option-switch" data-selection="camisas,4">
              <img src="/static/ilustracoes/avatar/camisas/4.png" alt="Camisa 4">
            </div>
            <div class="option-switch" data-selection="camisas,5">
              <img src="/static/ilustracoes/avatar/camisas/5.png" alt="Camisa 5">
            </div>
            <div class="option-switch" data-selection="camisas,6">
              <img src="/static/ilustracoes/avatar/camisas/6.png" alt="Camisa 6">
            </div>
            <div class="option-switch" data-selection="camisas,7">
              <img src="/static/ilustracoes/avatar/camisas/7.png" alt="Camisa 7">
            </div>
            <div class="option-switch" data-selection="camisas,8">
              <img src="/static/ilustracoes/avatar/camisas/8.png" alt="Camisa 8">
            </div>
            <div class="option-switch" data-selection="camisas,9">
              <img src="/static/ilustracoes/avatar/camisas/9.png" alt="Camisa 9">
            </div>
            <div class="option-switch" data-selection="camisas,10">
              <img src="/static/ilustracoes/avatar/camisas/10.png" alt="Camisa 10">
            </div>
          </div>

          <div class="category-title">Calça</div>
          <div class="option-grid">
            <div class="option-switch none-option" data-selection="calcas,0">
              <img src="/static/icones/v grena/25.png" alt="Nenhum">
            </div>
            <div class="option-switch" data-selection="calcas,1">
              <img src="/static/ilustracoes/avatar/calcas/1.png" alt="Calça 1">
            </div>
            <div class="option-switch" data-selection="calcas,2">
              <img src="/static/ilustracoes/avatar/calcas/2.png" alt="Calça 2">
            </div>
            <div class="option-switch" data-selection="calcas,3">
              <img src="/static/ilustracoes/avatar/calcas/3.png" alt="Calça 3">
            </div>
            <div class="option-switch" data-selection="calcas,4">
              <img src="/static/ilustracoes/avatar/calcas/4.png" alt="Calça 4">
            </div>
            <div class="option-switch" data-selection="calcas,5">
              <img src="/static/ilustracoes/avatar/calcas/5.png" alt="Calça 5">
            </div>
            <div class="option-switch" data-selection="calcas,6">
              <img src="/static/ilustracoes/avatar/calcas/6.png" alt="Calça 6">
            </div>
            <div class="option-switch" data-selection="calcas,7">
              <img src="/static/ilustracoes/avatar/calcas/7.png" alt="Calça 7">
            </div>
            <div class="option-switch" data-selection="calcas,8">
              <img src="/static/ilustracoes/avatar/calcas/8.png" alt="Calça 8">
            </div>
            <div class="option-switch" data-selection="calcas,9">
              <img src="/static/ilustracoes/avatar/calcas/9.png" alt="Calça 9">
            </div>
            <div class="option-switch" data-selection="calcas,10">
              <img src="/static/ilustracoes/avatar/calcas/10.png" alt="Calça 10">
            </div>
          </div>

          <div class="category-title">Acessório</div>
          <div class="option-grid">
            <div class="option-switch none-option" data-selection="acessorios,0">
              <img src="/static/icones/v grena/25.png" alt="Nenhum">
            </div>
            <div class="option-switch" data-selection="acessorios,1">
              <img src="/static/ilustracoes/avatar/acessorios/1.png" alt="Acessório 1">
            </div>
            <div class="option-switch" data-selection="acessorios,2">
              <img src="/static/ilustracoes/avatar/acessorios/2.png" alt="Acessório 2">
            </div>
            <div class="option-switch" data-selection="acessorios,3">
              <img src="/static/ilustracoes/avatar/acessorios/3.png" alt="Acessório 3">
            </div>
            <div class="option-switch" data-selection="acessorios,4">
              <img src="/static/ilustracoes/avatar/acessorios/4.png" alt="Acessório 4">
            </div>
            <div class="option-switch" data-selection="acessorios,5">
              <img src="/static/ilustracoes/avatar/acessorios/5.png" alt="Acessório 5">
            </div>
            <div class="option-switch" data-selection="acessorios,6">
              <img src="/static/ilustracoes/avatar/acessorios/6.png" alt="Acessório 6">
            </div>
            <div class="option-switch" data-selection="acessorios,7">
              <img src="/static/ilustracoes/avatar/acessorios/7.png" alt="Acessório 7">
            </div>
            <div class="option-switch" data-selection="acessorios,8">
              <img src="/static/ilustracoes/avatar/acessorios/8.png" alt="Acessório 8">
            </div>
            <div class="option-switch" data-selection="acessorios,9">
              <img src="/static/ilustracoes/avatar/acessorios/9.png" alt="Acessório 9">
            </div>
            <div class="option-switch" data-selection="acessorios,10">
              <img src="/static/ilustracoes/avatar/acessorios/10.png" alt="Acessório 10">
            </div>
          </div>

        </div>

        <button class="btn-primary btn-save-avatar" type="button">Salvar</button>
      </div>
    </div>
  </div>
</body>

</html>
