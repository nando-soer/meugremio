      <div class="avatar-wrap">
        <div class="avatar avatar-layers" id="mainAvatar"></div>
      </div>

      <div class="avatar-btn-wrap">
        <button class="btn-avatar btn-primary" type="button" onclick="abrirAvatar()">Alterar
          Avatar</button>
      </div>

      <form class="credential-form">
        <div class="row">
          <div class="field">
            <label for="name">Nome:</label>
            <input type="text" id="nome" class="text-input" placeholder="{{STUDENT_NAME}}">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="class">Turma:</label>
            <div class="select-wrap">
              <select id="userClass" name="turma" class="select-display" required>
                <option value="3_info" disabled selected>3° INFO</option>
                <option value="2_info">2° INFO</option>
                <option value="1_info">1° INFO</option>
                <option value="3_adm">3° ADM</option>
                <option value="2_adm">2° ADM</option>
                <option value="1_adm">1° ADM</option>
                <option value="1_mkt">1° MKT</option>
              </select>

              <span class="select-arrow">
                <img src="/static/icones/v branco/22.png">
              </span>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="bio">Bio/Descrição:</label>
            <textarea id="bio" class="text-input">
          </textarea>
          </div>
        </div>

        <button type="submit" class="btn-primary">Salvar</button>
      </form>

    </div>
  </div>
